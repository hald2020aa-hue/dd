name: Manga D Source Engine CI
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Provide non-secret local build variables
        env:
          MANGA_D_DEBUG_KEYSTORE_B64: ${{ secrets.MANGA_D_DEBUG_KEYSTORE_B64 }}
        run: |
          cp -n .env.example .env || true
          if [ -n "$MANGA_D_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$MANGA_D_DEBUG_KEYSTORE_B64" | base64 --decode > debug.keystore
            keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          elif [ ! -f debug.keystore ]; then
            echo '::warning::Temporary APK signing key; set the MANGA_D_DEBUG_KEYSTORE_B64 secret for updates'
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Unit tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: manga-d-source-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
